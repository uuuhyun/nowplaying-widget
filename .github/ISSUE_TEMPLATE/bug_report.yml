name: 🐛 버그 제보 / Bug report
description: 위젯이 예상대로 동작하지 않을 때
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요? / What happened?
      description: 기대한 동작과 실제 동작을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법 / Steps to reproduce
      placeholder: |
        1. Music에서 곡 재생
        2. 위젯의 ⏭ 클릭
        3. ...
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 버전 / macOS version
      placeholder: "예: macOS 26.1 (Apple Silicon)"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: 설치 방법 / Install method
      options: [Homebrew, install.sh, 직접 빌드 / built from source]
    validations:
      required: true
  - type: input
    id: displays
    attributes:
      label: 모니터 구성 / Displays
      placeholder: "예: 맥북 단독 / 맥북 + 외장 모니터 1대"
  - type: textarea
    id: extra
    attributes:
      label: 스크린샷·로그 / Screenshots or logs
      description: "로그 보기: log show --last 5m --predicate 'process == \"NowPlaying\"'"
